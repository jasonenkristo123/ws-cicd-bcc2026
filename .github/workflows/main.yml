name: DEPLOY MAIN JASON API

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Golang Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Linting code
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Golang Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Testing code
        run: go test ./... -v -cover
