name: DEPLOY MAIN JASON API

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Golang Linting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Linting code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

test:
  lint:
    name: Golang Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Linting code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Testing code
      - run: go test ./... -v -cover
